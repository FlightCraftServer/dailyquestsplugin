# ============================================
#  Кастомные квесты — свои задания поверх
#  стандартных типов. Поля:
#
#  type              — тип квеста (обязательно)
#  enabled           — включён ли
#  weight            — вес выбора (больше = чаще)
#  icon              — иконка в меню
#  description       — описание ({count}, {target}, {difficulty}, {reward})
#  count             — фиксированное количество (НЕ умножается
#                      на сложность). Укажите либо count,
#                      либо count-range
#  count-range       — диапазон [мин, макс]; умножается на сложность
#  targets           — цели; если пусто — берутся любые
#  rewards           — фиксированные награды по сложностям
#                      (если нет — награда сложности * reward-multiplier)
#  reward-multiplier — множитель награды (по умолчанию 1.0)
# ============================================
custom-quests:
  dragon_slayer:
    type: KILL_MOB
    enabled: true
    weight: 5
    icon: DRAGON_HEAD
    description: "Победи Эндер-дракона"
    count: 1
    targets:
      - ENDER_DRAGON
    rewards:
      EASY: 25
      MEDIUM: 50
      HARD: 100
      EXPERT: 200
  ancient_debris_miner:
    type: MINE_BLOCK
    enabled: true
    weight: 8
    icon: ANCIENT_DEBRIS
    description: "Добудь древние обломки"
    count-range: [2, 4]
    targets:
      - ANCIENT_DEBRIS
    reward-multiplier: 1.5
  wheat_farmer:
    type: BREAK_BLOCK
    enabled: true
    weight: 10
    icon: WHEAT
    description: "Собери урожай: &e{count}&7 растений"
    count-range: [50, 100]
    targets:
      - WHEAT
      - CARROTS
      - POTATOES
      - BEETROOTS
    reward-multiplier: 1.2

