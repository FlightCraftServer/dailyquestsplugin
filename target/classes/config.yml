# ============================================
#  DailyQuests — конфигурация
# ============================================

# Часовой пояс, в котором сбрасываются квесты
timezone: "Europe/Moscow"

# Время сброса квестов (в указанном часовом поясе)
reset-time: "00:00"

# Сколько квестов выдаётся игроку в день
quests-per-day: 3

# Сколько квестов игрок может выполнять одновременно
max-active: 1

# Таблица лидеров
leaderboard:
  # Сколько позиций показывать в /dailyquests leaderboard
  size: 10
  # Сколько лучших игроков получают бонус к награде
  top-positions: 3
  # Бонус в процентах от награды квеста для топ-игроков
  bonus-percent: 20

# Команда выдачи награды (%player% и %amount% заменяются автоматически)
reward-command: "eco give %player% %amount%"

# ============================================
#  Сложности
#  weight            — шанс выпадения сложности
#  count-multiplier  — множитель количества для квеста
#  reward            — базовая награда в монетах
#  display           — цвет/название в меню
# ============================================
difficulties:
  EASY:
    weight: 40
    count-multiplier: 1.0
    reward: 10
    display: "&aЛёгкий"
  MEDIUM:
    weight: 30
    count-multiplier: 2.0
    reward: 30
    display: "&eСредний"
  HARD:
    weight: 20
    count-multiplier: 5.0
    reward: 50
    display: "&6Сложный"
  EXPERT:
    weight: 10
    count-multiplier: 10.0
    reward: 100
    display: "&cЭкспертный"

# ============================================
#  Типы квестов
