name: DailyQuests
version: 1.3.0
main: ru.dailyquests.DailyQuestsPlugin
api-version: '1.21'
softdepend: [FCClans]
authors:
  - flw
description: "Ежедневные квесты: задания, награды и сброс каждый день в 00:00 МСК. Клановые квесты через FCClans."

commands:
  dailyquests:
    description: "Открыть меню ежедневных квестов"
    usage: "/dailyquests [time|leaderboard|reroll|clanreroll|reload]"
    aliases: [dq]

permissions:
  dailyquests.use:
    description: "Позволяет пользоваться ежедневными квестами"
    default: true
  dailyquests.admin:
    description: "Позволяет перезагружать конфиг и пересоздавать квесты"
    default: op