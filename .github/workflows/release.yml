name: Build and Release Plugin

# Сценарий срабатывает, когда ты создаёшь новый Релиз или Тег (например, v1.0.0)
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем исходный код из репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Настраиваем Java (укажи нужную версию, например 17 или 21 для свежих версий Paper)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven' # Кэширует зависимости, чтобы сборка шла быстрее

      # 3. Собираем плагин через Maven
      - name: Build with Maven
        run: mvn clean package --batch-mode

      # 4. Загружаем скомпилированный .jar в раздел Releases
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: target/*.jar # Выбирает скомпилированный jar из папки target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
