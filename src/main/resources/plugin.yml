name: DailyQuests
version: 1.0.0
main: ru.dailyquests.DailyQuestsPlugin
api-version: '1.21'
authors:
  - flw
description: "Ежедневные квесты: задания, награды и сброс каждый день в 00:00 МСК"

commands:
  dailyquests:
    description: "Открыть меню ежедневных квестов"
    usage: "/dailyquests [time|reload]"
    aliases: [dq]

permissions:
  dailyquests.use:
    description: "Позволяет пользоваться ежедневными квестами"
    default: true
  dailyquests.admin:
    description: "Позволяет перезагружать конфиг"
    default: op
