#  enabled            — включён ли тип
#  weight             — вес выбора типа (больше = чаще)
#  icon               — предмет-иконка в меню
#  description        — описание квеста.
#                       Доступные плейсхолдеры:
#                       {count}, {target}, {difficulty}, {reward}
#  count-range        — диапазон базового количества [мин, макс].
#                       Итоговое количество = случайное из диапазона
#                       * множитель сложности
#  reward-multiplier  — множитель награды типа (поверх награды сложности)
#  targets            — список возможных целей. Пустой список = без цели
#                       (например, "убить любых мобов")
# ============================================
